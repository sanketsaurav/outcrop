# Plugin releases use bare semver tags (e.g. "0.1.0") matching manifest.json —
# the Obsidian community-plugin and BRAT convention. Server releases use
# "server-v*" tags (see release-server.yml).
name: Release plugin
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build plugin
        working-directory: plugin
        run: |
          npm ci
          npm run build
      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest.json version $version" >&2
            exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" manifest.json plugin/main.js plugin/styles.css \
            --title "Outcrop plugin $tag" --generate-notes
