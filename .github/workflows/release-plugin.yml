# Plugin releases use bare semver tags (e.g. "0.1.0") matching manifest.json —
# the Obsidian community-plugin and BRAT convention. Server releases use
# "server-v*" tags (see release-server.yml).
name: Release plugin
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build plugin
        working-directory: plugin
        run: |
          npm ci
          npm run build
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            plugin/main.js
            plugin/styles.css
            manifest.json
      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest.json version $version" >&2
            exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Notes come from this tag's CHANGELOG.md section ("## X.Y.Z ...");
          # fall back to a generated commit list when no section matches.
          notes_args="--generate-notes"
          if [ -f CHANGELOG.md ]; then
            awk -v v="## ${tag} " 'index($0, v) == 1 {f=1; next} /^## /{f=0} f' CHANGELOG.md > /tmp/notes.md
            if [ -s /tmp/notes.md ]; then
              notes_args="--notes-file /tmp/notes.md"
            else
              echo "::warning::no CHANGELOG.md section matching '## ${tag} ' — using generated notes"
            fi
          fi
          gh release create "$tag" manifest.json plugin/main.js plugin/styles.css \
            --title "Outcrop plugin $tag" $notes_args
